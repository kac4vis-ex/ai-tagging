name: Master AI Metrics on Push

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main, master]

jobs:
  calc-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate AI and Human Lines for pushed range
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Processing push range: $BEFORE..$AFTER"
          echo "Commit type check..."

          # ── Case 1: Normal merge commit (has 2 parents) ──────────────────
          if git rev-parse "$AFTER^2" > /dev/null 2>&1; then
            echo "Normal merge commit detected"

            # Get all commits that came in via the merged branch
            MERGE_BASE=$(git merge-base "$AFTER^1" "$AFTER^2")

            # Sum AI lines from commit messages in the merged branch
            TOTAL_AI=$(git log "$MERGE_BASE..$AFTER^2" --pretty=%B \
              | grep "^AI-Lines-Of-Code:" \
              | awk -F': ' '{sum+=$2} END {print sum+0}')

            # Total lines added from the merged branch
            TOTAL_ADDED=$(git diff --numstat "$MERGE_BASE..$AFTER^2" \
              | awk '{add+=$1} END {print add+0}')

          # ── Case 2: Squash merge or regular push (single parent) ─────────
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push detected"

            TOTAL_ADDED=$(git ls-files | xargs -I{} git show "$AFTER:{}" 2>/dev/null | wc -l || echo 0)

            TOTAL_AI=$(git log --pretty=%B "$AFTER" \
              | grep "^AI-Lines-Of-Code:" \
              | awk -F': ' '{sum+=$2} END {print sum+0}')

          else
            echo "Squash merge or direct push detected"

            # Total lines added
            TOTAL_ADDED=$(git diff --numstat "$BEFORE..$AFTER" \
              | awk '{add+=$1} END {print add+0}')

            # Sum AI-Lines-Of-Code from all commit messages in range
            TOTAL_AI=$(git log "$BEFORE..$AFTER" --pretty=%B \
              | grep "^AI-Lines-Of-Code:" \
              | awk -F': ' '{sum+=$2} END {print sum+0}')
          fi

          TOTAL_HUMAN=$((TOTAL_ADDED - TOTAL_AI))
          if [ "$TOTAL_HUMAN" -lt 0 ]; then TOTAL_HUMAN=0; fi

          PCT=$(awk "BEGIN { printf \"%.1f\", ($TOTAL_ADDED > 0 ? ($TOTAL_AI / $TOTAL_ADDED) * 100 : 0) }")

          echo "AI_LINES=$TOTAL_AI"       >> "$GITHUB_OUTPUT"
          echo "TOTAL_ADDED=$TOTAL_ADDED" >> "$GITHUB_OUTPUT"
          echo "HUMAN_LINES=$TOTAL_HUMAN" >> "$GITHUB_OUTPUT"
          echo "PCT=$PCT"                 >> "$GITHUB_OUTPUT"

          echo "Computed: AI=$TOTAL_AI, Added=$TOTAL_ADDED, Human=$TOTAL_HUMAN, PCT=${PCT}%"

      - name: Post or update AI Metrics issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const before = context.payload.before;
            const after  = context.payload.after;

            const ai     = parseInt('${{ steps.calc.outputs.AI_LINES }}')    || 0;
            const added  = parseInt('${{ steps.calc.outputs.TOTAL_ADDED }}') || 0;
            const human  = parseInt('${{ steps.calc.outputs.HUMAN_LINES }}') || 0;
            const pct    = '${{ steps.calc.outputs.PCT }}' || '0.0';

            const title = 'AI Metrics Summary (main)';
            const body  = [
              '## 🧾 AI Metrics — `main` branch',
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Push range | \`${before.slice(0,7)}\` → \`${after.slice(0,7)}\` |`,
              `| Total lines added | ${added} |`,
              `| AI-generated lines | ${ai} (${pct}%) |`,
              `| Human-written lines | ${human} |`,
              '',
              '_This issue is updated automatically by CI on every push to `main`._'
            ].join('\n');

            const issues   = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              console.log(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              console.log(`Created issue #${created.data.number}`);
            }